name: Tests

on:
  push:
    branches:
      - feat/v9-foundation-clean
      - main
  pull_request:
    branches:
      - feat/v9-foundation-clean
      - main

jobs:
  test:
    name: pytest (Python 3.11+)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log commands

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # V9 = 100% stdlib Python, dev deps uniquement
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check core/ scripts/ tests/
          ruff format --check core/ scripts/ tests/

      - name: Run tests
        run: |
          # V9 = lecture seule sur data/v9_forces.db (qui n'existe pas en CI)
          # Les tests créent leur propre DB tmp via tmp_path
          python -m pytest tests/ -v --tb=short --maxfail=10
        env:
          # CI = pas de Telegram (skip alertes)
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""

      - name: V9 guards (cohérence automatisée)
        run: |
          # Gardiens V9 — vérifient la cohérence code/docs/secrets (R7, R14, R26)
          python scripts/v9_guards.py no-secrets || exit 1
          python scripts/v9_guards.py yaml-sync || exit 1
          python scripts/v9_guards.py scripts-exist || exit 1
          python scripts/v9_guards.py hitl-sync || exit 1
          # db-sync skippé en CI (pas de data/v9_forces.db)

      - name: Verify docs sync
        run: |
          # Vérif cohérence doc/code (F-16) — non bloquant
          python -c "
          from pathlib import Path
          from datetime import datetime, timedelta
          import re
          cutoff = datetime.now() - timedelta(days=90)
          warnings = []
          for f in Path('docs').rglob('*.md'):
              content = f.read_text(encoding='utf-8', errors='ignore')
              dates = re.findall(r'2026-\\d{2}-\\d{2}', content[:500])
              if dates and Path(f).name != 'README.md':
                  # Format AAA-MM-JJ
                  last = datetime.strptime(dates[-1], '%Y-%m-%d')
                  if last < cutoff:
                      warnings.append(f'{f}: dernière date {dates[-1]} > 90j')
          if warnings:
              print('⚠️  Warnings (non-bloquants):')
              for w in warnings:
                  print(f'  {w}')
          else:
              print('✅ Tous les docs ont une date < 90j')
          " || true

      - name: Test summary
        if: always()
        run: |
          echo "## Tests results" >> $GITHUB_STEP_SUMMARY
          echo "Python ${{ matrix.python-version }} ✅" >> $GITHUB_STEP_SUMMARY
