id: ADAPTIVE_VOL_GATE
version: 2
origin: V9-P3-CONSUME
status: ACTIVE
v9_status: ACTIVE
kind: node_rule
created_by: hermes_v9
created_at: '2026-07-14'
promoted_at: '2026-07-14'
scope:
  # Scope aligne sur les 7 node_rule historiques (cf.
  # test_evaluate_principles_restricts_by_timeframe_scope) :
  # M5/M15/H1/H4, jamais M30 (regle 29 : pas de lecture directe sur
  # les TF intermediaires). D1 laisse aux principes de zone.
  timeframes:
  - 5
  - 15
  - 60
  - 240
  currencies: ALL
# P3-CONSUME (2026-07-14) — premier principe qui CONSOMME les seuils
# adaptatifs poses dans _load_shared_context par P3-WIRE (commit 1babf14).
# Verifie que la coalition respecte le seuil adapte a la vol/news/TF
# courant, pas un seuil hard-code.
#
# Effet : ne declenche que si P3-WIRE est ON (kill switch
# V9_ADAPTIVE_THRESHOLDS_WIRED_ENABLED=1) ET que les champs
# adaptive_*_threshold sont presents dans le context. Si P3-WIRE est
# OFF, les champs sont absents (cf. tests/test_p3_wire_integration.py),
# les conditions "value_field" retombent sur None, le principe ne
# declenche pas (degradation gracieuse R6).
conditions:
# Filtre contexte : on ne consomme les seuils adaptatifs que si on est
# en vol elevee (HIGH/EXTREME). En LOW/NORMAL, le seuil baseline est OK,
# pas besoin d'adaptation.
- field: vol_regime
  op: in
  value:
  - HIGH
  - EXTREME
# Degradation gracieuse R6 (R25' "ne leve jamais") : si les seuils
# adaptatifs ne sont pas dans le context (P3-WIRE OFF), le principe
# ne declenche pas. On gate sur leur presence AVANT les comparaisons
# value_field (qui tapent dans None sinon et font crasher
# evaluate_condition sur TypeError float >= None).
- field: adaptive_coalition_threshold
  op: is_not_null
  value: true
- field: adaptive_antagonism_threshold
  op: is_not_null
  value: true
# Consommation reelle des seuils adaptatifs (P3-CONSUME) :
# coalition_strength >= adaptive_coalition_threshold
# (en HIGH baseline 5.38, en EXTREME * 1.5 = 8.07, etc.)
- field: coalition_strength
  op: '>='
  value_field: adaptive_coalition_threshold
# antagonismes_count <= adaptive_antagonism_threshold
# (en vol haute, on accepte plus d'antagonisme, donc seuil adapte elargi)
# Note : champ réel = antagonismes_count (posé ligne 553 de principle_engine).
# Anciennement mal nommé antagonism_strength (jamais posé — corrigé 2026-07-14 audit ZCode).
- field: antagonismes_count
  op: '<='
  value_field: adaptive_antagonism_threshold
# Gate session : on n'evalue pas en transition weekend (regle 29).
- field: session_marche
  op: is_not_null
  value: true
emits:
  pattern_type: ADAPTIVE_VOL_GATE
  direction: from_coalition_dir
bounds:
  coalition_strength:
    min: 0.0
    max: 1.0
  antagonismes_count:
    min: 0
    max: 100
anti_signal_bias: false
notes: |
  P3-CONSUME (2026-07-14) — Principe SHADOW qui CONSOMME les seuils
  adaptatifs (adaptive_coalition_threshold, adaptive_antagonism_threshold)
  poses par P3-WIRE dans _load_shared_context. Le pattern utilise
  value_field (deja supporte par evaluate_condition, cf.
  test_evaluate_condition_value_field_comparison) pour comparer deux
  champs du context entre eux.

  R25' : SHADOW = vocabulaire descriptif, pas de promotion ACTIVE
  sans decision CEO tracee dans DECISIONS_LOG. Ce principe sert de
  VALIDATION que les seuils adaptatifs sont effectivement lus par
  la chaine cognitive (avant de considerer une promotion).

  Doctrine respectee :
  - R8  : ajout d'un nouveau fichier core/v9/principles/ADAPTIVE_VOL_GATE.yaml
          (pas de modif d'un fichier existant, pas de backup MD5 requis,
          meme convention que trader_mini_baseline, auto_calibrator).
  - R18 : pas de LLM dans la boucle.
  - R22 : ce fichier est livre seul dans le commit P3-CONSUME
          (1 commit par unite logique).
  - R25' : SHADOW par defaut, promotion = motion CEO separee.
  - R26 : tests pytest a valider (test_p3_consume.py).
  - R28 : push non automatique, CEO merge.

  References :
  - DECISIONS_LOG §2026-07-14 (motion CEO coordination ZCode/Hermes)
  - workspace/perplexity/COORDINATION_NOTE.md (P3-CONSUME assigne a Hermes)
  - commit 1babf14 (P3-WIRE, pose les seuils dans le context)
  - commit 5abfa2b (P3 module pur adaptive_thresholds_at_runtime.py)
