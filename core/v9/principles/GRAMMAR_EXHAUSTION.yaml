notes: |
  Mot de grammaire 'EXHAUSTION' — source V8 pf_grammar.py (z_gbp > 2.0).
  Adapté V9 via z_current (zone_diagnostics) + state filter.
  Seuil 2.0 = z-score GBP en zone d'épuisement (retour probable).
  Conditions écrites 2026-07-10 (Hermes diagnostic V8 → V9).

  FIX DIVERSIFY 2026-07-16 (Claude Opus, diagnostic 3200 contextes réels) :
  le filtre state=[EARLY_EXTREME, EXTENSION] bloquait 100% des cas.
  Vérifié en DB : quand z_current>=2.0, state est TOUJOURS RUPTURE
  (207/207 contextes), jamais EARLY_EXTREME ni EXTENSION. De plus la
  valeur "EXTENSION" n'existe pas dans zone_diagnostics.state
  (valeurs réelles : NEUTRAL/ACCUMULATING/RUPTURE/EARLY_EXTREME/LEAKING).
  Correction : state ∈ {EARLY_EXTREME, RUPTURE} — sémantique intacte
  (z-score extrême = épuisement en rupture de zone, retour probable).
