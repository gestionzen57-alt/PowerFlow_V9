id: NODE_BIRTH_FAST
version: 1
origin: V7
status: active
kind: node_rule
created_by: claude_code
created_at: '2026-06-12'
scope:
  timeframes:
  - 5
  - 15
  - 60
  - 240
  currencies: ALL
conditions:
- field: state
  op: in
  value:
  - EARLY_EXTREME
  - ACCUMULATING
  - LEAKING
  - RUPTURE
- field: prev_state
  op: ==
  value: NEUTRAL
- field: z_current
  op: '>='
  value: 1.0
  transform: abs
- field: bars_in_extreme
  op: <=
  value: 2
emits:
  pattern_type: ZONE_NODE
  direction: mean_reversion_from_z
bounds:
  z_current:
    min: 1.0
    max: 2.5
  bars_in_extreme:
    min: 1
    max: 8
anti_signal_bias: false
notes: 'Pont node->signal (detect_node_birth_fast). Seul NODE mesuré: WR30j=71% (n=31).
  Mean-reversion HIGH->SHORT / LOW->LONG. Parité à prouver avant promotion ACTIVE.'
