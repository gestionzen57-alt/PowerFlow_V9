id: GRAVITY_RESPRING_NODE
version: 1
origin: V7
status: ACTIVE
v9_status: ACTIVE
kind: node_rule
created_by: claude_code
created_at: '2026-06-12'
scope:
  timeframes:
  - 5
  - 15
  - 60
  - 240
  currencies: ALL
conditions:
- field: state
  op: in
  value:
  - LEAKING
  - ACCUMULATING
- field: prev_state
  op: ==
  value: RUPTURE
# Tâche C — gravité crédible seulement si la coalition dominante est
# confirmée sur un TF >= H1 (propagation macro, pas un simple rebond M5).
- field: coalition_mtf_depth
  op: in
  value:
  - H1
  - H4
  - D1
# Tâche B — rebond gravitationnel favorisé en environnement RISK_OFF
# (refuges haussiers = pression vendeuse qui se relâche).
- field: risk_sentiment
  op: not_in
  value:
  - RISK_ON
emits:
  pattern_type: ZONE_NODE
  direction: from_z_extreme_dir
bounds: {}
anti_signal_bias: false
notes: Rebond gravitationnel post-RUPTURE. DORMANT (0 émis) — conditions jamais réunies.
