id: POWER_ANGLE_BREAK_TO_PRICE_IMPACT
version: 1
origin: V7
status: active
kind: node_rule
created_by: claude_code
created_at: '2026-06-12'
scope:
  timeframes:
  - 5
  - 15
  - 60
  - 240
  currencies: ALL
conditions:
- field: state
  op: ==
  value: RUPTURE
- field: tension_score
  op: '>='
  value: 1.0
# News-aware (session 4) : principe plus fiable en POST_NEWS (réorganisation post-choc).
# NEUTRE autorisé (marché normal). NEWS_SHOCK/PRE_NEWS exclus (volatilité/pic non directionnel).
- field: news_phase
  op: in
  value:
  - POST_NEWS
  - NEUTRE
emits:
  pattern_type: ZONE_NODE
  direction: from_z_extreme_dir
bounds:
  tension_score:
    min: 0.7
    max: 2.0
  # news_distance_min : négatif = minutes après la news.
  # Dans POST_NEWS, borne [-60, 0] = dans l'heure qui suit.
  # Confiance boostée via position dans la borne (proche de 0 = plus récent = +confiance).
  news_distance_min:
    min: -60
    max: 0
anti_signal_bias: false
notes: |
  RUPTURE forte tension. DORMANT (0 émis).
  News-aware : en POST_NEWS + HIGH importance, confiance +15 implicite
  via borne news_distance_min (proche de 0 = plus récent = signal plus fiable).
  En PRE_NEWS ou NEWS_SHOCK, le principe ne déclenche pas (filtre news_phase).
