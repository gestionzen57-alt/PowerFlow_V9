notes: |
  Mot de grammaire 'EXTENSION' — source pf_grammar.py, TF M5/M1, statut doc=VALID.
  Entrée documentaire (kind=grammar, non émetteur). Promotion ACTIVE conditionnée
  à WR V8 >= 50%.

  CHANTIER YAML MTF 2026-07-08 : conditions demandées à l'origine —
  `compression_extension.etat == "EXTENSION"` et `compression_extension.intensite
  >= 0.3` — ADAPTÉES après vérification CONTEXT_CONTRACT.md + lecture de
  core/v9/principle_engine.py, pour deux raisons :

  1. Nom de champ : `evaluate_condition` fait un lookup à plat
     (`context.get(cond["field"])`, aucune résolution de chemin pointé). Le champ
     réel exposé dans le contexte est `compression_extension_etat` (underscore),
     jamais `compression_extension.etat` (point) — écrire le champ avec un point
     l'aurait rendu structurellement toujours None (bug de la classe
     GRAMMAR_PULLBACK pré-refonte, cf. notes GRAMMAR_PULLBACK.yaml).
  2. Valeur : `compression_extension_etat` est peuplé depuis forces_reader.py
     (L235-238) et scene_builder.py (L462-465) avec des valeurs MINUSCULES
     ("extension" / "compression" / "neutre"), jamais "EXTENSION" en majuscules.
  3. `compression_extension.intensite` (CONTEXT_CONTRACT.md : PROPAGÉ, mais
     "Consommé par BehaviorAnalyzer" uniquement) N'EST PAS extrait dans
     `_load_shared_context()` : le bloc qui construit `cross_tf_context`
     (principle_engine.py L367-375) ne lit que `compression_extension_etat`
     depuis `forces_row`, jamais `compression_extension_intensite` (existe
     pourtant en colonne DB, cf. db_schema.py L53). Condition retirée : elle
     aurait été structurellement insatisfiable (0 trigger garanti), et
     `principle_engine.py` est hors périmètre de modification pour ce chantier
     (contrainte fermée de session). Gap tracé pour réévaluation :
     `compression_extension_intensite` (forces_snapshots) n'est jamais propagé
     au contexte YAML — candidat à ajouter au récapitulatif DORMANT de
     CONTEXT_CONTRACT.md (nouvelle entrée, hors périmètre ici car nécessiterait
     de toucher principle_engine.py).

  Portée additionnelle : `compression_extension_etat` n'est peuplé dans
  `cross_tf_context` que lorsque le snapshot courant est en TF H1 ou M5
  (principle_engine.py L358-393) — cohérent avec `scope.timeframes` documenté
  ci-dessus (source pf_grammar.py, TF M5/M1). Sur les autres TF, la clé est
  absente du contexte -> condition évaluée False (dégradation gracieuse,
  jamais d'exception).
