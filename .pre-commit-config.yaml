# PowerFlow V9 — pre-commit hooks (F-19, 2026-07-07 + Motion CEO #2 2026-07-20)
# Installe : pip install pre-commit && pre-commit install
# Garantit : lint ruff + tests rapides + 7 gardiens V9 avant chaque commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Linter (rapide, < 10ms par fichier)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

      # Formatter (aligné avec pyproject.toml)
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Anti-commit accidentel de secrets (.env, .env.local, config/telegram.json)
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # Tests rapides avant commit (uniquement les < 1s)
      - id: pytest-fast
        name: pytest fast tests
        entry: python -m pytest tests/ -q -x --tb=line -m "not slow"
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        # Ne bloque PAS le commit, juste alerte (fast tests < 1s)
        # Activer 'always_run: true' pour bloquer.

      # ── Gardiens V9 (cohérence automatisée, R7/R14/R26) ──
      - id: v9-no-secrets
        name: V9 — pas de token Telegram/GitHub en clair
        entry: python scripts/v9_guards.py no-secrets
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      - id: v9-yaml-sync
        name: V9 — YAML disque = PRINCIPLE_ACTIVE_IDS
        entry: python scripts/v9_guards.py yaml-sync
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      - id: v9-scripts-exist
        name: V9 — scripts MCP référencés existent
        entry: python scripts/v9_guards.py scripts-exist
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      - id: v9-hitl-sync
        name: V9 — HITL_CONF_HIGH cohérent entre modules
        entry: python scripts/v9_guards.py hitl-sync
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      # ── Motion CEO #2 (2026-07-20 §09h00) — câblage cron toujours wrappé ──
      # Empêche le décâblage futur des 11 Scheduled Tasks V9_* (cf commit
      # 0faf2e9). Bloque le commit si un cron perd son wrapper
      # v9_load_kill_switches.py. SKIP=cron-audit pour bypasser.
      - id: v9-cron-wiring
        name: V9 — 11 Scheduled Tasks wrappés avec v9_load_kill_switches.py
        entry: python scripts/v9_audit_cron_wiring.py
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      - id: v9-db-sync
        name: V9 — DB schema sync (db-sync guardian)
        entry: python scripts/v9_guards.py db-sync
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

      - id: v9-kill-switch-integrity
        name: V9 — kill switch integrity (config ↔ runtime)
        entry: python scripts/v9_guards.py kill-switch-integrity
        language: system
        pass_filenames: false
        types: [text]
        stages: [pre-commit]

# ── Config globale ─────────────────────────────────────────
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false  # affiche toutes les erreurs au lieu de stopper au 1er
